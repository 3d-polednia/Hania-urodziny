<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hania kończy roczek! 🎈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FDF8EF;
    --rose:#E8919E;
    --rose-deep:#D9707F;
    --violet:#A593C9;
    --sun:#F0B94A;
    --peach:#EFA678;
    --sky:#9FCBDB;
    --leaf:#B5C98A;
    --ink:#4B4458;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:var(--cream);
    font-family:'Quicksand',sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
  }

  .card{
    width:100%;
    max-width:440px;
    background:white;
    border-radius:28px;
    overflow:hidden;
    box-shadow: 0 30px 60px -20px rgba(75,68,88,0.25), 0 0 0 1px rgba(75,68,88,0.04);
  }

  .hero{
    width:100%;
    display:block;
  }

  .hero img{
    width:100%;
    display:block;
  }

  .actions{
    padding: 26px 26px 12px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:15px 20px;
    border-radius:16px;
    border:none;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
    text-decoration:none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active{
    transform: scale(0.97);
  }

  .btn svg{
    width:20px; height:20px;
    flex-shrink:0;
  }

  .btn-calendar{
    background: var(--rose);
    color:white;
    box-shadow: 0 10px 20px -8px rgba(217,112,127,0.55);
  }

  .btn-map{
    background: white;
    color: var(--violet);
    border: 2px solid var(--violet);
  }

  .meta{
    padding: 6px 26px 28px;
    text-align:center;
  }

  .meta-row{
    display:flex;
    justify-content:center;
    gap:22px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }

  .meta-item{
    text-align:center;
  }

  .meta-item .label{
    display:block;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.5px;
    color:var(--violet);
    text-transform:uppercase;
    margin-bottom:3px;
  }

  .meta-item .value{
    font-size:15px;
    font-weight:700;
    color:var(--ink);
  }

  .address{
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    opacity:0.75;
    line-height:1.5;
  }

  .footnote{
    margin-top:16px;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    opacity:0.55;
  }

  @media (prefers-reduced-motion: no-preference){
    .card{ animation: rise 0.7s cubic-bezier(.2,.9,.25,1.1) both; }
  }
  @keyframes rise{ from{transform:translateY(16px); opacity:0} to{transform:translateY(0); opacity:1} }
</style>
</head>
<body>

<div class="card">
  <div class="hero">
    <img src="assets/hania.jpg" alt="Hania kończy roczek — zaproszenie na 26 lipca, godz. 13:00, ul. Dębowa, 49-345 Skorogoszcz">
  </div>

  <div class="actions">
    <a class="btn btn-calendar" href="hania-urodziny.ics" download="Hania-roczek.ics">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Dodaj do kalendarza
    </a>
    <a class="btn btn-map" href="https://www.google.com/maps/search/?api=1&query=ul.+D%C4%99bowa%2C+49-345+Skorogoszcz" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      Pokaż trasę
    </a>
  </div>

  <div class="meta">
    <div class="meta-row">
      <div class="meta-item">
        <span class="label">Data</span>
        <span class="value">26 lipca 2026</span>
      </div>
      <div class="meta-item">
        <span class="label">Godzina</span>
        <span class="value">13:00</span>
      </div>
    </div>
    <p class="address">ul. Dębowa<br>49-345 Skorogoszcz</p>
    <p class="footnote">Do zobaczenia! 🎈</p>
  </div>
</div>

</body>
</html>
