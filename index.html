<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1. Urodziny Hani!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Great+Vibes&family=Montserrat:wght@500;700&display=swap');

  body {
    /* Tło w różowo-białe paski z drugiego obrazka */
    background: repeating-linear-gradient(
      90deg,
      #ffdbea,
      #ffdbea 20px,
      #ffffff 20px,
      #ffffff 40px
    );
    font-family: 'Montserrat', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }

  .card {
    background: #fffcf8;
    /* Falista ramka zrobiona za pomocą zaokrągleń i cienia */
    border: 6px solid #f48bb0;
    border-radius: 30px;
    width: 100%;
    max-width: 450px;
    padding: 50px 20px;
    text-align: center;
    position: relative;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    overflow: hidden;
  }

  /* Tęcza z pierwszego obrazka (lewa strona) */
  .rainbow {
    position: absolute;
    top: 20px;
    left: 10px;
    font-size: 70px;
    transform: rotate(-15deg);
  }

  /* Słońce z pierwszego obrazka (prawa strona) */
  .sun {
    position: absolute;
    top: 15px;
    right: 15px;
    font-size: 75px;
  }

  .one-container {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    font-family: 'Fredoka One', cursive;
    font-size: 90px;
    margin-top: 40px;
    line-height: 0.8;
  }

  /* Miejsce na zdjęcie twarzy Hani */
  .head {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background-image: url('126503.jpg');
    background-size: cover;
    background-position: center;
    position: relative;
    margin-right: 5px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  /* Czapeczka urodzinowa nałożona na głowę (z pomocą emoji lub możesz podmienić na obrazek) */
  .hat {
    position: absolute;
    top: -50px;
    left: 15px;
    font-size: 55px;
    transform: rotate(15deg);
  }

  .letter-n { color: #9da8d6; }
  .letter-e { color: #8bbce6; }

  .happy {
    font-family: 'Great Vibes', cursive;
    color: #ed7e9e;
    font-size: 50px;
    margin: -5px 0 5px 0;
  }

  .girl {
    font-family: 'Fredoka One', cursive;
    font-size: 70px;
    letter-spacing: 2px;
  }

  .g-g { color: #a4d1a2; }
  .g-i { color: #f9d857; }
  .g-r { color: #ef8ca9; }
  .g-l { color: #c49bc8; }

  .details {
    margin-top: 40px;
    color: #4a4a4a;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .title {
    color: #ed7e9e;
    font-size: 26px;
    font-weight: 700;
    margin: 15px 0;
    letter-spacing: 1px;
  }

  .date-time {
    font-weight: 700;
    margin-bottom: 10px;
    font-size: 15px;
  }

  .address {
    font-size: 12px;
    color: #666;
  }

  /* Drobne ozdobniki z tła */
  .sparkle1 { position: absolute; bottom: 40px; left: 30px; font-size: 20px; color: #f9d857; }
  .sparkle2 { position: absolute; bottom: 60px; right: 40px; font-size: 24px; color: #8bbce6; }
</style>
</head>
<body>

  <div class="card">
    <div class="rainbow">🌈</div>
    <div class="sun">☀️</div>

    <div class="one-container">
      <div class="head">
        <div class="hat">🎉</div>
      </div>
      <div class="letter-n">N</div>
      <div class="letter-e">E</div>
    </div>
    
    <div class="happy">happy</div>
    
    <div class="girl">
      <span class="g-g">G</span><span class="g-i">I</span><span class="g-r">R</span><span class="g-l">L</span>
    </div>

    <div class="details">
      <p>Dołącz do nas by świętować</p>
      <div class="title">1. URODZINY HANI</div>
      <p class="date-time">NIEDZIELA, 26 LIPCA 2026<br>GODZINA 13:00</p>
      <p class="address">ul. Dębowa, 49-345 Skorogoszcz</p>
    </div>

    <div class="sparkle1">✨</div>
    <div class="sparkle2">✨</div>
  </div>

</body>
</html>
