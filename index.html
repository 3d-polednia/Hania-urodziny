<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1. Urodziny Hani!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,700&family=Montserrat:wght@400;600&display=swap');

  body {
    background-color: #f5f5f5;
    font-family: 'Montserrat', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }

  .card {
    background: #ffffff;
    width: 100%;
    max-width: 500px;
    padding: 40px 20px;
    text-align: center;
    position: relative;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    overflow: hidden;
    /* Złagodzone rogi karty */
    border-radius: 15px; 
  }

  /* Grafiki dekoracyjne (zastępcze emoji/symbole przypominające akwarele z obrazka) */
  .bunting {
    position: absolute;
    top: -20px;
    left: 20px;
    font-size: 80px;
    opacity: 0.8;
  }

  .sun {
    position: absolute;
    top: -10px;
    right: -20px;
    font-size: 140px;
    opacity: 0.9;
  }

  .rainbow {
    position: absolute;
    bottom: -40px;
    left: -50px;
    font-size: 250px;
    opacity: 0.8;
    z-index: 0;
  }

  /* Kontener na główny napis i zdjęcie */
  .header-section {
    position: relative;
    margin-top: 80px;
    margin-bottom: 40px;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .face-container {
    position: absolute;
    left: 10%;
    top: 10px;
    z-index: 2;
  }

  /* Czapeczka urodzinowa */
  .hat {
    position: absolute;
    top: -45px;
    left: -10px;
    font-size: 60px;
    transform: rotate(-15deg);
    z-index: 3;
  }

  .face {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }

  /* Typografia tytułowa */
  .name {
    font-family: 'Playfair Display', serif;
    color: #b39cd0; /* Fioletowy */
    font-size: 55px;
    margin: 0;
    line-height: 1;
    margin-left: 40px; /* Przesunięcie w prawo, by zrobić miejsce na zdjęcie */
  }

  .is-turning {
    font-family: 'Playfair Display', serif;
    color: #f4c26a; /* Żółto-pomarańczowy */
    font-size: 32px;
    margin: 5px 0 0 0;
    margin-left: 40px;
  }

  .one {
    font-family: 'Playfair Display', serif;
    color: #f78da7; /* Różowy */
    font-size: 110px;
    margin: -10px 0 0 0;
    line-height: 1;
  }

  /* Sekcja informacyjna */
  .details-section {
    position: relative;
    z-index: 1;
    margin-top: 50px;
    padding-left: 40%; /* Przesunięcie tekstu na prawą stronę, obok tęczy */
    text-align: center;
  }

  .join-us {
    font-size: 12px;
    color: #555;
    letter-spacing: 1.5px;
    margin-bottom: 20px;
    text-transform: uppercase;
  }

  .date-time-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
  }

  .date-block {
    text-align: right;
    padding-right: 15px;
    border-right: 2px solid #888;
  }

  .date-month {
    font-size: 16px;
    color: #555;
    letter-spacing: 2px;
    margin: 0;
  }

  .date-day {
    font-family: 'Playfair Display', serif;
    font-size: 45px;
    color: #f78da7;
    margin: -5px 0 0 0;
    line-height: 1;
  }

  .time-block {
    text-align: left;
    padding-left: 15px;
    color: #555;
    font-size: 14px;
    line-height: 1.8;
  }

  .address {
    font-size: 12px;
    color: #555;
    letter-spacing: 1px;
    line-height: 1.5;
    margin-top: 20px;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="bunting">🎊</div>
    <div class="sun">☀️</div>
    <div class="rainbow">🌈</div>

    <div class="header-section">
      <div class="face-container">
        <div class="hat">🎉</div>
        <img src="assets/hania.jpg" alt="Twarz Hani" class="face">
      </div>
      
      <h1 class="name">Hania</h1>
      <h2 class="is-turning">is turning</h2>
      <h3 class="one">one</h3>
    </div>

    <div class="details-section">
      <div class="join-us">DOŁĄCZ DO NAS BY ŚWIĘTOWAĆ</div>
      
      <div class="date-time-container">
        <div class="date-block">
          <p class="date-month">LIPIEC</p>
          <p class="date-day">26</p>
        </div>
        <div class="time-block">
          GODZINA<br>
          13:00
        </div>
      </div>

      <div class="address">
        UL. DĘBOWA<br>
        49-345 SKOROGOSZCZ
      </div>
    </div>
  </div>

</body>
</html>
